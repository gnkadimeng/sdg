{% extends "base.html" %}
{% block title %}Register | SDG Escape Room{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-6">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo" style="height: 80px;">
    </div>
    <div class="card shadow p-4">
      <h2 class="text-center mb-4">📝 Register</h2>
      <form method="POST">
        <div class="mb-3">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" name="firstName" required>
        </div>
        <div class="mb-3">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" name="lastName" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
        </div>

        <div class="mb-3">
          <label for="securityQuestion" class="form-label">Security Question</label>
          <select class="form-select" id="securityQuestion" name="securityQuestion" required>
            <option value="" selected disabled>Select a security question</option>
            <option value="What was your first pet's name?">What was your first pet's name?</option>
            <option value="What city were you born in?">What city were you born in?</option>
            <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
            <option value="What was the name of your first school?">What was the name of your first school?</option>
            <option value="What is your favorite book?">What is your favorite book?</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="securityAnswer" class="form-label">Answer to Security Question</label>
          <input type="text" class="form-control" id="securityAnswer" name="securityAnswer" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-success">Register</button>
        </div>
      </form>
      <div class="mt-3 text-center">
        <small>Already have an account? <a href="{{ url_for('login') }}">Login here</a></small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
