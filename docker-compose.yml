version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sustain_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: V@lidation@uj2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_NAME: sustain_app
      DB_USER: postgres
      DB_PASSWORD: V@lidation@uj2025
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: 6ce255c00e63d46c5af17afd44fdccb3
      FLASK_ENV: development
      FLASK_APP: "app.py"  # Make sure this points to your main app file
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "flask db upgrade && flask run --host=0.0.0.0 --port=5000"

volumes:
  postgres_data: